name: Benchmark

on:
  workflow_dispatch:
    inputs:
      provider:
        description: LLM provider
        required: false
        default: groq
        type: choice
        options: [groq, openrouter]
      model:
        description: Model id
        required: false
        default: ''
      report_issues:
        description: Create issues for failures
        required: false
        default: true
        type: boolean

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write model config
        run: |
          mkdir -p "$HOME/.bitori"
          cat > "$HOME/.bitori/config.yaml" <<YAML
          profiles:
            - name: bench
              protocol: openai-chat
              model: "${LLM_MODEL}"
              base_url: "${LLM_BASE_URL}"
              api_key: "\${LLM_API_KEY}"
              context_window: 131072
          YAML
          printf 'LLM_API_KEY=%s\n' "$LLM_API_KEY" > "$HOME/.bitori/.env"
        env:
          LLM_BASE_URL: ${{ inputs.provider == 'groq' && 'https://api.groq.com/openai/v1' || 'https://openrouter.ai/api/v1' }}
          LLM_API_KEY: ${{ (inputs.provider == 'groq' && secrets.GROQ_LLM_API_KEY) || secrets.OPENROUTER_LLM_API_KEY }}

      - name: Run benchmarks
        id: bench
        env:
          BITORI_BENCH_PROVIDER: ${{ inputs.provider }}
          BITORI_BENCH_MODEL: ${{ inputs.model || (inputs.provider == 'groq' && vars.GROQ_MODEL) || vars.OPENROUTER_MODEL }}
          BITORI_BENCH_PROFILE: bench
        run: |
          set +e
          npm run bench | tee benchmark-output.jsonl
          bench_status="${PIPESTATUS[0]}"
          set -e
          run_id="$(node -e "const line=require('fs').readFileSync('benchmark-output.jsonl','utf8').trim().split('\n').pop(); console.log(JSON.parse(line).runId)")"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          exit "$bench_status"

      - name: Report failures as issues
        if: failure() && inputs.report_issues && steps.bench.outputs.run_id
        env:
          GH_TOKEN: ${{ github.token }}
        run: npx tsx benchmarks/report-issues.ts "${{ steps.bench.outputs.run_id }}"

      - name: Upload ledger
        if: always() && steps.bench.outputs.run_id
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ steps.bench.outputs.run_id }}
          path: benchmarks/results/${{ steps.bench.outputs.run_id }}.json
