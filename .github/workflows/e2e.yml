name: E2E LLM

on:
  workflow_dispatch:
    inputs:
      protocol:
        description: 接口方言（留空则按地址与密钥形状自动识别）
        required: false
        default: ''
        type: string
      model:
        description: 覆盖 vars.LLM_MODEL（留空则用变量）
        required: false
        default: ''
        type: string
      preset:
        description: 验收场景（image 强制最多一次 Provider 聊天调用）
        required: true
        default: 'image'
        type: choice
        options: ['image', 'loop', 'fix-test', 'add-test', 'refactor']
      max_tokens:
        description: 运行后超额判定阈值（不会阻止请求超过此值）
        required: true
        default: '50000'
        type: choice
        options: ['25000', '50000', '100000', '150000']
      max_credits:
        description: 运行后超额判定阈值（不会阻止请求超过此值）
        required: true
        default: '1'
        type: choice
        options: ['1', '2', '5']

permissions:
  contents: read

jobs:
  providers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require dispatch from the default branch
        env:
          DISPATCH_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          [[ "$DISPATCH_REF" == "refs/heads/$DEFAULT_BRANCH" ]] || {
            echo 'Provider acceptance must be dispatched from the repository default branch'; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # 凭据与端点统一走 LLM_* 三个变量；真实端点会按 protocol 拼路径
      # （anthropic 由 SDK 拼成 <base_url>/v1/messages）。
      - name: Check connectivity with the real credentials
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          E2E_INPUT_MODEL: ${{ inputs.model }}
          E2E_INPUT_PROTOCOL: ${{ inputs.protocol }}
        run: |
          if [ -n "$E2E_INPUT_MODEL" ]; then export LLM_MODEL="$E2E_INPUT_MODEL"; fi
          if [ -n "$E2E_INPUT_PROTOCOL" ]; then export LLM_PROTOCOL="$E2E_INPUT_PROTOCOL"; fi
          node dist/bin/bitori.js doctor

      - name: Run real provider acceptance
        env:
          E2E_API_KEY: ${{ secrets.LLM_API_KEY }}
          E2E_BASE_URL: ${{ vars.LLM_BASE_URL }}
          E2E_MODEL: ${{ inputs.model || vars.LLM_MODEL }}
          BITORI_E2E_PROVIDERS: '1'
          BITORI_E2E_PROTOCOL: ${{ inputs.protocol }}
          BITORI_E2E_MAX_TOKENS: ${{ inputs.max_tokens }}
          BITORI_E2E_MAX_CREDITS: ${{ inputs.max_credits }}
          BITORI_E2E_PRESET: ${{ inputs.preset }}
          BITORI_E2E_RESULTS_DIR: ${{ runner.temp }}/e2e-evidence
        run: npm run test:e2e:providers

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-evidence-${{ inputs.protocol || 'auto' }}-${{ inputs.preset }}
          path: ${{ runner.temp }}/e2e-evidence/
          if-no-files-found: ignore
          retention-days: 7
