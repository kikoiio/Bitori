name: E2E LLM

on:
  workflow_dispatch:
    inputs:
      provider:
        description: LLM provider
        required: false
        default: openrouter
        type: choice
        options: [openrouter, groq]
      model:
        description: Model id, or __list__ to only list provider models
        required: false
        default: ''

jobs:
  openrouter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # OpenRouter 免费档每天约 50 次请求；异常时先看日志，不要连续重跑消耗额度。
      - name: Run real endpoint e2e
        env:
          LLM_BASE_URL: ${{ inputs.provider == 'groq' && 'https://api.groq.com/openai/v1' || 'https://openrouter.ai/api/v1' }}
          LLM_API_KEY: ${{ (inputs.provider == 'groq' && secrets.GROQ_LLM_API_KEY) || secrets.OPENROUTER_LLM_API_KEY }}
          OPENROUTER_MODEL: ${{ inputs.model || (inputs.provider == 'groq' && vars.GROQ_MODEL) || vars.OPENROUTER_MODEL }}
        run: npx tsx tests/acceptance/e2e-openrouter.ts
