name: E2E OpenRouter

on:
  workflow_dispatch:
    inputs:
      model:
        description: OpenRouter model id
        required: false
        default: ''

jobs:
  openrouter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # OpenRouter 免费档每天约 50 次请求；异常时先看日志，不要连续重跑消耗额度。
      - name: Run real endpoint e2e
        env:
          LLM_API_KEY: ${{ secrets.OPENROUTER_LLM_API_KEY }}
          OPENROUTER_MODEL: ${{ inputs.model || vars.OPENROUTER_MODEL }}
        run: npx tsx tests/acceptance/e2e-openrouter.ts
