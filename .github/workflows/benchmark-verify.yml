name: Benchmark Verify

on:
  schedule:
    - cron: '30 15 * * *'
  workflow_dispatch:
    inputs:
      provider:
        description: LLM provider
        required: false
        default: groq
        type: choice
        options: [groq, openrouter]
  pull_request:
    branches: [master]

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify benchmark harness
        run: node --test benchmarks/engineering.test.mjs

      - name: Select tasks
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          plan="$(npx tsx benchmarks/verify-issues.ts plan)"
          echo "plan=$plan" >> "$GITHUB_OUTPUT"
          echo "tasks=$(node -e "console.log([...new Set(JSON.parse(process.argv[1]).map(x => x.taskId))].join(','))" "$plan")" >> "$GITHUB_OUTPUT"
      - name: Write model config
        if: steps.select.outputs.tasks != ''
        run: |
          : "${LLM_MODEL:?缺少模型配置}"
          : "${LLM_API_KEY:?缺少 API key}"
          mkdir -p "$HOME/.bitori"
          cat > "$HOME/.bitori/config.yaml" <<YAML
          profiles:
            - name: bench
              protocol: openai-chat
              model: "${LLM_MODEL}"
              base_url: "${LLM_BASE_URL}"
              api_key: "\${LLM_API_KEY}"
              context_window: 131072
          YAML
          printf 'LLM_API_KEY=%s\n' "$LLM_API_KEY" > "$HOME/.bitori/.env"
        env:
          LLM_BASE_URL: ${{ (github.event_name == 'pull_request' || inputs.provider == 'openrouter') && 'https://openrouter.ai/api/v1' || 'https://api.groq.com/openai/v1' }}
          LLM_API_KEY: ${{ (github.event_name == 'pull_request' || inputs.provider == 'openrouter') && secrets.OPENROUTER_LLM_API_KEY || secrets.GROQ_LLM_API_KEY }}
          LLM_MODEL: ${{ (github.event_name == 'pull_request' || inputs.provider == 'openrouter') && vars.OPENROUTER_MODEL || vars.GROQ_MODEL }}

      - name: Build before starting verification
        if: steps.select.outputs.tasks != ''
        run: npm run build

      - name: Mark verification started
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.select.outputs.tasks != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BITORI_VERIFY_PLAN: ${{ steps.select.outputs.plan }}
        run: npx tsx benchmarks/verify-issues.ts start

      - name: Run targeted benchmarks
        id: bench
        if: steps.select.outputs.tasks != ''
        env:
          BITORI_BENCH_PROVIDER: ${{ (github.event_name == 'pull_request' || inputs.provider == 'openrouter') && 'openrouter' || 'groq' }}
          BITORI_BENCH_MODEL: ${{ (github.event_name == 'pull_request' || inputs.provider == 'openrouter') && vars.OPENROUTER_MODEL || vars.GROQ_MODEL }}
          BITORI_BENCH_PROFILE: bench
          BITORI_BENCH_TASKS: ${{ steps.select.outputs.tasks }}
          BITORI_BENCH_TASK_DELAY_MS: '5000'
        run: |
          set +e
          npx tsx benchmarks/run.ts | tee benchmark-output.jsonl
          bench_status="${PIPESTATUS[0]}"
          set -e
          run_id="$(node -e "const line=require('fs').readFileSync('benchmark-output.jsonl','utf8').trim().split('\n').pop(); console.log(JSON.parse(line).runId)")"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "status=$bench_status" >> "$GITHUB_OUTPUT"
          exit "$bench_status"

      - name: Close verified issues
        if: always() && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.select.outputs.tasks != '' && steps.bench.outputs.run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BITORI_VERIFY_PLAN: ${{ steps.select.outputs.plan }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BITORI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BENCH_RUN_ID: ${{ steps.bench.outputs.run_id }}
        run: npx tsx benchmarks/verify-issues.ts finish "$BENCH_RUN_ID"

      - name: Upload ledger
        if: always() && steps.bench.outputs.run_id != ''
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-verify-${{ steps.bench.outputs.run_id }}
          path: benchmarks/results/${{ steps.bench.outputs.run_id }}.json
