name: Benchmark Verify

on:
  schedule:
    - cron: '30 15 * * *'
  workflow_dispatch:
    inputs:
      provider:
        description: LLM provider
        required: false
        default: groq
        type: choice
        options: [groq, openrouter]
  pull_request:
    branches: [master]

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Select tasks
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            # PR 验证：只重跑 PR body 列出的上游 Issue 对应任务。
            numbers="$(gh pr view "$PR_NUMBER" --json body --jq '.body' | grep -oE '#[0-9]+' | grep -oE '[0-9]+' | sort -u | tr '\n' ' ')"
            if [ -z "$numbers" ]; then
              echo "tasks=" >> "$GITHUB_OUTPUT"
              echo "issues=" >> "$GITHUB_OUTPUT"
              echo "::notice::PR 未引用 benchmark Issue，跳过定向验证"
            else
              task_ids=""
              for n in $numbers; do
                task="$(gh issue view "$n" --json title --jq '.title' | sed -n 's/^\[benchmark\] \(.*\) 未通过.*/\1/p')"
                task_ids="$task_ids,$task"
              done
              echo "tasks=${task_ids#,}" >> "$GITHUB_OUTPUT"
              echo "issues=$(echo "$numbers" | tr ' ' '\n' | paste -sd, -)" >> "$GITHUB_OUTPUT"
            fi
          else
            # 定时验证：防抖后挑出可重跑的开放 Issue。
            plan="$(npx tsx benchmarks/verify-issues.ts plan)"
            echo "tasks=$(node -e "console.log(JSON.parse(process.argv[1]).tasks.join(','))" "$plan")" >> "$GITHUB_OUTPUT"
            echo "issues=$(node -e "console.log(JSON.parse(process.argv[1]).issueNumbers.join(','))" "$plan")" >> "$GITHUB_OUTPUT"
          fi
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Write model config
        if: steps.select.outputs.tasks != ''
        run: |
          mkdir -p "$HOME/.bitori"
          cat > "$HOME/.bitori/config.yaml" <<YAML
          profiles:
            - name: bench
              protocol: openai-chat
              model: "${LLM_MODEL}"
              base_url: "${LLM_BASE_URL}"
              api_key: "\${LLM_API_KEY}"
              context_window: 131072
          YAML
          printf 'LLM_API_KEY=%s\n' "$LLM_API_KEY" > "$HOME/.bitori/.env"
        env:
          LLM_BASE_URL: ${{ (github.event_name == 'pull_request' || inputs.provider == 'openrouter') && 'https://openrouter.ai/api/v1' || 'https://api.groq.com/openai/v1' }}
          LLM_API_KEY: ${{ (github.event_name == 'pull_request' || inputs.provider == 'openrouter') && secrets.OPENROUTER_LLM_API_KEY || secrets.GROQ_LLM_API_KEY }}
          LLM_MODEL: ${{ (github.event_name == 'pull_request' || inputs.provider == 'openrouter') && vars.OPENROUTER_MODEL || vars.GROQ_MODEL }}

      - name: Run targeted benchmarks
        id: bench
        if: steps.select.outputs.tasks != ''
        env:
          BITORI_BENCH_PROVIDER: ${{ (github.event_name == 'pull_request' || inputs.provider == 'openrouter') && 'openrouter' || 'groq' }}
          BITORI_BENCH_MODEL: ${{ (github.event_name == 'pull_request' || inputs.provider == 'openrouter') && vars.OPENROUTER_MODEL || vars.GROQ_MODEL }}
          BITORI_BENCH_PROFILE: bench
          BITORI_BENCH_TASKS: ${{ steps.select.outputs.tasks }}
          BITORI_BENCH_TASK_DELAY_MS: '5000'
        run: |
          set +e
          npm run bench | tee benchmark-output.jsonl
          bench_status="${PIPESTATUS[0]}"
          set -e
          run_id="$(node -e "const line=require('fs').readFileSync('benchmark-output.jsonl','utf8').trim().split('\n').pop(); console.log(JSON.parse(line).runId)")"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "status=$bench_status" >> "$GITHUB_OUTPUT"
          exit "$bench_status"

      - name: Close verified issues
        if: always() && steps.select.outputs.issues != '' && steps.bench.outputs.run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          outcome=fail
          if [ "${{ steps.bench.outputs.status }}" = "0" ]; then outcome=pass; fi
          npx tsx benchmarks/verify-issues.ts close \
            --outcome "$outcome" \
            --run-id "${{ steps.bench.outputs.run_id }}" \
            --run-url "${{ github.event_name == 'pull_request' && format('{0}/checks', github.event.pull_request.html_url) || github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            $(echo "${{ steps.select.outputs.issues }}" | tr ',' ' ')

      - name: Upload ledger
        if: always() && steps.bench.outputs.run_id != ''
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-verify-${{ steps.bench.outputs.run_id }}
          path: benchmarks/results/${{ steps.bench.outputs.run_id }}.json
