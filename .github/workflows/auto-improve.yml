name: Auto Improve

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Benchmark issue number to fix
        required: true
        type: string

permissions:
  contents: write
  issues: read
  pull-requests: write

jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Bitori
        run: npm run build

      - name: Write model config
        run: |
          mkdir -p "$HOME/.bitori"
          cat > "$HOME/.bitori/config.yaml" <<YAML
          profiles:
            - name: bench
              protocol: openai-chat
              model: "${LLM_MODEL}"
              base_url: "${LLM_BASE_URL}"
              api_key: "\${LLM_API_KEY}"
              context_window: 131072
          YAML
          printf 'LLM_API_KEY=%s\n' "$LLM_API_KEY" > "$HOME/.bitori/.env"
        env:
          LLM_BASE_URL: ${{ vars.AUTO_IMPROVE_PROVIDER == 'groq' && 'https://api.groq.com/openai/v1' || 'https://openrouter.ai/api/v1' }}
          LLM_API_KEY: ${{ (vars.AUTO_IMPROVE_PROVIDER == 'groq' && secrets.GROQ_LLM_API_KEY) || secrets.OPENROUTER_LLM_API_KEY }}
          LLM_MODEL: ${{ vars.AUTO_IMPROVE_MODEL || vars.OPENROUTER_MODEL }}

      - name: Let Bitori attempt the fix
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/auto-improve.sh "${{ inputs.issue_number }}"
