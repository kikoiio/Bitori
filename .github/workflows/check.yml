name: Check

on:
  push:
    branches: [master, "desktop/**"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify TUI cursor in a Linux PTY
        if: runner.os == 'Linux'
        run: npm run test:tui:cursor:pty

      - name: Run full check
        run: npm run check
