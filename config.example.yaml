# 复制到 ~/.bitori/config.yaml，在同目录 .env 中配置三个 LLM 连接参数。
profiles:
  - name: claude-main
    protocol: anthropic
    model: ${LLM_MODEL}
    base_url: ${LLM_BASE_URL}
    api_key: ${LLM_API_KEY}
    thinking: true
    # 可选；缺省 anthropic=200000，openai*=128000。
    context_window: 200000

# 可选 MCP：只在准备好真实服务和凭据后取消注释并替换占位值。
# MCP 配置中的变量在启动时展开，缺失即报错。
# mcp_servers:
#   remote-search:
#     transport: http
#     url: https://your-server.example/mcp
#     headers:
#       Authorization: Bearer ${MCP_REMOTE_TOKEN}

# 可选：SubAgent 逻辑模型名 -> profile 名；未命中时回退当前 profile。
# models:
#   haiku: claude-main
